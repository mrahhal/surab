name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x.x

      - name: Setup LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "16.0"

      - name: Build rust
        run: cargo build --verbose

      - name: Build dotnet
        run: dotnet build

      - name: Test
        run: dotnet test
