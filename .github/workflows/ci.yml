name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x.x

      # - name: Setup LLVM
      #   uses: KyleMayes/install-llvm-action@v2
      #   with:
      #     version: "16.0"

      # - name: Test LLVM
      #   shell: bash
      #   run: clang --version
      #   continue-on-error: true

      - name: Build rust
        run: cargo build --verbose

      - name: Build dotnet
        run: dotnet build

      - name: Test analysis
        run: dotnet test ./test/analysis-tests/
        continue-on-error: true
      - name: Test compilation
        run: dotnet test ./test/compilation-tests/
        continue-on-error: true
      - name: Test integration
        run: dotnet test ./test/integration-tests/

      # - name: Test
      #   run: dotnet test
